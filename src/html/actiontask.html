<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Action Management</title>
    <script src="/_sdk/element_sdk.js"></script>
    <script src="/_sdk/data_sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            box-sizing: border-box;
        }

        .task-card {
            transition: all 0.3s ease;
        }

        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .action-item {
            transition: all 0.2s ease;
        }

        .action-item:hover {
            background-color: #f8fafc;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .hours-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .hour-option {
            padding: 8px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .hour-option:hover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }

        .hour-option.selected {
            border-color: #3b82f6;
            background-color: #3b82f6;
            color: white;
        }
    </style>
    <style>
        @view-transition {
            navigation: auto;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-full"><!-- Toast Notification -->
    <div id="toast" class="toast bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg"><span
            id="toastMessage">การดำเนินการสำเร็จ!</span>
    </div>
    <div class="container mx-auto px-4 py-8"><!-- Header -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <div class="flex justify-between items-center">
                <div>
                    <h1 id="appTitle" class="text-3xl font-bold text-gray-800">📋 Task Action Management</h1>
                    <p class="text-gray-600 mt-2">จัดการงานและ Action Tasks อย่างเป็นระบบ</p>
                </div>
                <div class="flex gap-3"><button onclick="showAddTaskModal()" id="addTaskBtn"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition-colors">
                        ➕ เพิ่มงานใหม่ </button>
                </div>
            </div>
        </div><!-- Stats Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center">
                    <div class="bg-blue-100 p-3 rounded-full"><span class="text-2xl">📋</span>
                    </div>
                    <div class="ml-4">
                        <p class="text-gray-600 text-sm">งานหลักทั้งหมด</p>
                        <p class="text-2xl font-bold text-gray-800" id="totalParentTasks">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center">
                    <div class="bg-green-100 p-3 rounded-full"><span class="text-2xl">⚡</span>
                    </div>
                    <div class="ml-4">
                        <p class="text-gray-600 text-sm">Action Tasks</p>
                        <p class="text-2xl font-bold text-green-600" id="totalActionTasks">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center">
                    <div class="bg-yellow-100 p-3 rounded-full"><span class="text-2xl">⏱️</span>
                    </div>
                    <div class="ml-4">
                        <p class="text-gray-600 text-sm">ชั่วโมงรวม</p>
                        <p class="text-2xl font-bold text-yellow-600" id="totalHours">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center">
                    <div class="bg-purple-100 p-3 rounded-full"><span class="text-2xl">✅</span>
                    </div>
                    <div class="ml-4">
                        <p class="text-gray-600 text-sm">เสร็จแล้ว</p>
                        <p class="text-2xl font-bold text-purple-600" id="completedActions">0</p>
                    </div>
                </div>
            </div>
        </div><!-- Filter Section -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <div class="flex flex-wrap gap-4 items-center">
                <div><label class="block text-sm font-medium text-gray-700 mb-2">กรองตามผู้รับผิดชอบ</label> <select
                        id="personFilter" onchange="filterTasks()"
                        class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="all">ทั้งหมด</option>
                    </select>
                </div>
                <div><label class="block text-sm font-medium text-gray-700 mb-2">กรองตามสถานะ</label> <select
                        id="statusFilter" onchange="filterTasks()"
                        class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="all">ทั้งหมด</option>
                        <option value="in-progress">กำลังดำเนินการ</option>
                        <option value="complete">เสร็จแล้ว</option>
                    </select>
                </div>
                <div class="ml-auto"><button onclick="clearAllData()"
                        class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm transition-colors">
                        🗑️ ล้างข้อมูลทั้งหมด </button>
                </div>
            </div>
        </div><!-- Tasks List -->
        <div class="bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-6">รายการงาน</h2>
            <div id="tasksList" class="space-y-6"><!-- Tasks will be rendered here -->
            </div>
            <div id="emptyState" class="text-center py-12"><span class="text-6xl">📝</span>
                <h3 class="text-xl font-medium text-gray-600 mt-4">ยังไม่มีงานในระบบ</h3>
                <p class="text-gray-500 mt-2">เริ่มต้นด้วยการเพิ่มงานใหม่</p>
            </div>
        </div>
    </div><!-- Add Parent Task Modal -->
    <div id="addTaskModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl p-8 m-4 w-full max-w-md">
            <h3 class="text-2xl font-bold text-gray-800 mb-6">เพิ่มงานหลักใหม่</h3>
            <form id="addTaskForm" onsubmit="addParentTask(event)">
                <div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-2">รหัสงาน (Parent Task
                        ID)</label> <input type="text" id="parentTaskId" required
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="เช่น PROJ-001">
                </div>
                <div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-2">ชื่องาน</label> <input
                        type="text" id="taskTitle" required
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="ระบุชื่องาน">
                </div>
                <div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-2">รายละเอียด</label>
                    <textarea id="taskDescription" rows="3"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="รายละเอียดงาน"></textarea>
                </div>
                <div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-2">กำหนดส่ง</label> <input
                        type="date" id="dueDate" required
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="mb-6"><label class="block text-sm font-medium text-gray-700 mb-2">ผู้รับผิดชอบ</label>
                    <input type="text" id="assignPerson" required
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="ชื่อผู้รับผิดชอบ">
                </div>
                <div class="flex gap-3"><button type="button" onclick="hideAddTaskModal()"
                        class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-700 py-2 px-4 rounded-lg font-medium transition-colors">
                        ยกเลิก </button> <button type="submit"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg font-medium transition-colors">
                        เพิ่มงาน </button>
                </div>
            </form>
        </div>
    </div><!-- Add Action Task Modal -->
    <div id="addActionModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl p-8 m-4 w-full max-w-md">
            <h3 class="text-2xl font-bold text-gray-800 mb-6">เพิ่ม Action Task</h3>
            <form id="addActionForm" onsubmit="addActionTask(event)"><input type="hidden" id="actionParentId">
                <div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-2">ชื่อ Action Task</label>
                    <input type="text" id="actionTitle" required
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="ระบุชื่อ Action Task">
                </div>
                <div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-2">รายละเอียด</label>
                    <textarea id="actionDescription" rows="2"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="รายละเอียด Action Task"></textarea>
                </div>
                <div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-2">จำนวนชั่วโมงที่ทำ</label>
                    <div class="hours-selector">
                        <div class="hour-option" data-hours="0.5">
                            0.5
                        </div>
                        <div class="hour-option" data-hours="1">
                            1
                        </div>
                        <div class="hour-option" data-hours="2">
                            2
                        </div>
                        <div class="hour-option" data-hours="3">
                            3
                        </div>
                        <div class="hour-option" data-hours="4">
                            4
                        </div>
                        <div class="hour-option" data-hours="5">
                            5
                        </div>
                        <div class="hour-option" data-hours="6">
                            6
                        </div>
                        <div class="hour-option" data-hours="7">
                            7
                        </div>
                        <div class="hour-option" data-hours="8">
                            8
                        </div>
                    </div><input type="hidden" id="selectedHours" required>
                </div>
                <div class="mb-6"><label class="block text-sm font-medium text-gray-700 mb-2">สถานะ</label> <select
                        id="actionStatus" required
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="in-progress">กำลังดำเนินการ</option>
                        <option value="complete">เสร็จแล้ว</option>
                    </select>
                </div>
                <div class="flex gap-3"><button type="button" onclick="hideAddActionModal()"
                        class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-700 py-2 px-4 rounded-lg font-medium transition-colors">
                        ยกเลิก </button> <button type="submit"
                        class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-lg font-medium transition-colors">
                        เพิ่ม Action </button>
                </div>
            </form>
        </div>
    </div>
    <script>
        let allData = [];
        let currentRecordCount = 0;

        // Default configuration
        const defaultConfig = {
            app_title: "📋 Task Action Management",
            add_task_button: "➕ เพิ่มงานใหม่"
        };

        // Data handler for SDK
        const dataHandler = {
            onDataChanged(data) {
                allData = data;
                currentRecordCount = data.length;
                renderTasks();
                updateStats();
                updateFilters();
            }
        };

        // Element SDK configuration
        const elementConfig = {
            defaultConfig: defaultConfig,
            onConfigChange: async (config) => {
                const appTitle = document.getElementById('appTitle');
                const addTaskBtn = document.getElementById('addTaskBtn');

                if (appTitle) {
                    appTitle.textContent = config.app_title || defaultConfig.app_title;
                }
                if (addTaskBtn) {
                    addTaskBtn.textContent = config.add_task_button || defaultConfig.add_task_button;
                }
            },
            mapToCapabilities: (config) => ({
                recolorables: [],
                borderables: [],
                fontEditable: undefined,
                fontSizeable: undefined
            }),
            mapToEditPanelValues: (config) => new Map([
                ["app_title", config.app_title || defaultConfig.app_title],
                ["add_task_button", config.add_task_button || defaultConfig.add_task_button]
            ])
        };

        // Initialize SDKs
        async function initializeApp() {
            try {
                if (window.elementSdk) {
                    await window.elementSdk.init(elementConfig);
                }

                if (window.dataSdk) {
                    const result = await window.dataSdk.init(dataHandler);
                    if (!result.isOk) {
                        console.error("Failed to initialize data SDK");
                    }
                }
            } catch (error) {
                console.error("Failed to initialize app:", error);
            }
        }

        // Toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            toastMessage.textContent = message;
            toast.className = `toast ${type === 'success' ? 'bg-green-500' : 'bg-red-500'} text-white px-6 py-3 rounded-lg shadow-lg show`;

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Hours selector functionality
        document.addEventListener('DOMContentLoaded', function () {
            const hourOptions = document.querySelectorAll('.hour-option');
            const selectedHoursInput = document.getElementById('selectedHours');

            hourOptions.forEach(option => {
                option.addEventListener('click', function () {
                    hourOptions.forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedHoursInput.value = this.dataset.hours;
                });
            });
        });

        // Modal functions
        function showAddTaskModal() {
            document.getElementById('addTaskModal').classList.remove('hidden');
            document.getElementById('addTaskModal').classList.add('flex');
        }

        function hideAddTaskModal() {
            document.getElementById('addTaskModal').classList.add('hidden');
            document.getElementById('addTaskModal').classList.remove('flex');
            document.getElementById('addTaskForm').reset();
        }

        function showAddActionModal(parentTaskId) {
            document.getElementById('actionParentId').value = parentTaskId;
            document.getElementById('addActionModal').classList.remove('hidden');
            document.getElementById('addActionModal').classList.add('flex');

            // Reset hours selection
            document.querySelectorAll('.hour-option').forEach(opt => opt.classList.remove('selected'));
            document.getElementById('selectedHours').value = '';
        }

        function hideAddActionModal() {
            document.getElementById('addActionModal').classList.add('hidden');
            document.getElementById('addActionModal').classList.remove('flex');
            document.getElementById('addActionForm').reset();
        }

        // Add parent task
        async function addParentTask(event) {
            event.preventDefault();

            if (currentRecordCount >= 999) {
                showToast('ถึงขีดจำกัดสูงสุด 999 รายการแล้ว กรุณาลบข้อมูลบางส่วนก่อน', 'error');
                return;
            }

            const parentTaskId = document.getElementById('parentTaskId').value;
            const title = document.getElementById('taskTitle').value;
            const description = document.getElementById('taskDescription').value;
            const dueDate = document.getElementById('dueDate').value;
            const assignPerson = document.getElementById('assignPerson').value;

            // Check if parent_task_id already exists
            const existingTask = allData.find(item => item.parent_task_id === parentTaskId && item.type === 'parent');
            if (existingTask) {
                showToast('รหัสงานนี้มีอยู่แล้ว กรุณาใช้รหัสอื่น', 'error');
                return;
            }

            const newTask = {
                id: `parent_${Date.now()}`,
                parent_task_id: parentTaskId,
                title: title,
                description: description,
                due_date: dueDate,
                assign_person: assignPerson,
                type: 'parent',
                hours: 0,
                status: 'in-progress',
                created_at: new Date().toISOString()
            };

            const result = await window.dataSdk.create(newTask);
            if (result.isOk) {
                hideAddTaskModal();
                showToast('เพิ่มงานหลักสำเร็จ!');
            } else {
                showToast('เกิดข้อผิดพลาดในการเพิ่มงาน', 'error');
            }
        }

        // Add action task
        async function addActionTask(event) {
            event.preventDefault();

            if (currentRecordCount >= 999) {
                showToast('ถึงขีดจำกัดสูงสุด 999 รายการแล้ว กรุณาลบข้อมูลบางส่วนก่อน', 'error');
                return;
            }

            const parentTaskId = document.getElementById('actionParentId').value;
            const title = document.getElementById('actionTitle').value;
            const description = document.getElementById('actionDescription').value;
            const hours = parseFloat(document.getElementById('selectedHours').value);
            const status = document.getElementById('actionStatus').value;

            if (!hours) {
                showToast('กรุณาเลือกจำนวนชั่วโมง', 'error');
                return;
            }

            const newAction = {
                id: `action_${Date.now()}`,
                parent_task_id: parentTaskId,
                title: title,
                description: description,
                due_date: '',
                assign_person: '',
                type: 'action',
                hours: hours,
                status: status,
                created_at: new Date().toISOString()
            };

            const result = await window.dataSdk.create(newAction);
            if (result.isOk) {
                hideAddActionModal();
                showToast('เพิ่ม Action Task สำเร็จ!');
            } else {
                showToast('เกิดข้อผิดพลาดในการเพิ่ม Action Task', 'error');
            }
        }

        // Update action status
        async function updateActionStatus(actionId, newStatus) {
            const action = allData.find(item => item.__backendId === actionId);
            if (action) {
                action.status = newStatus;
                const result = await window.dataSdk.update(action);
                if (result.isOk) {
                    showToast('อัปเดตสถานะสำเร็จ!');
                } else {
                    showToast('เกิดข้อผิดพลาดในการอัปเดต', 'error');
                }
            }
        }

        // Delete item
        async function deleteItem(itemId) {
            const item = allData.find(item => item.__backendId === itemId);
            if (item) {
                // If deleting parent task, also delete all related actions
                if (item.type === 'parent') {
                    const relatedActions = allData.filter(a => a.parent_task_id === item.parent_task_id && a.type === 'action');

                    // Delete all related actions first
                    for (const action of relatedActions) {
                        await window.dataSdk.delete(action);
                    }
                }

                const result = await window.dataSdk.delete(item);
                if (result.isOk) {
                    showToast(item.type === 'parent' ? 'ลบงานหลักและ Action Tasks ที่เกี่ยวข้องแล้ว' : 'ลบ Action Task แล้ว');
                } else {
                    showToast('เกิดข้อผิดพลาดในการลบ', 'error');
                }
            }
        }

        // Clear all data
        function clearAllData() {
            const confirmDiv = document.createElement('div');
            confirmDiv.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
            confirmDiv.innerHTML = `
                <div class="bg-white rounded-xl p-6 m-4 max-w-md">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">ยืนยันการลบข้อมูล</h3>
                    <p class="text-gray-600 mb-6">คุณต้องการลบข้อมูลทั้งหมดใช่หรือไม่? การดำเนินการนี้ไม่สามารถย้อนกลับได้</p>
                    <div class="flex gap-3">
                        <button onclick="this.closest('.fixed').remove()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-700 py-2 px-4 rounded-lg transition-colors">
                            ยกเลิก
                        </button>
                        <button onclick="confirmClearAll()" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-lg transition-colors">
                            ลบทั้งหมด
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(confirmDiv);
        }

        async function confirmClearAll() {
            for (const item of allData) {
                await window.dataSdk.delete(item);
            }
            document.querySelector('.fixed.inset-0').remove();
            showToast('ลบข้อมูลทั้งหมดเรียบร้อยแล้ว');
        }

        // Render tasks
        function renderTasks() {
            const tasksList = document.getElementById('tasksList');
            const emptyState = document.getElementById('emptyState');

            const parentTasks = getFilteredParentTasks();

            if (parentTasks.length === 0) {
                tasksList.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            tasksList.innerHTML = parentTasks.map(parentTask => {
                const actions = allData.filter(item =>
                    item.parent_task_id === parentTask.parent_task_id &&
                    item.type === 'action'
                );

                const totalHours = actions.reduce((sum, action) => sum + (action.hours || 0), 0);
                const completedActions = actions.filter(action => action.status === 'complete').length;

                return `
                    <div class="task-card bg-gray-50 rounded-lg p-6 border-l-4 border-blue-500 fade-in">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-medium">${parentTask.parent_task_id}</span>
                                    <h3 class="text-lg font-semibold text-gray-800">${parentTask.title}</h3>
                                </div>
                                ${parentTask.description ? `<p class="text-gray-600 mb-3">${parentTask.description}</p>` : ''}
                                <div class="flex flex-wrap gap-2 text-sm">
                                    <span class="px-2 py-1 bg-purple-100 text-purple-700 rounded-full">📅 ${formatDate(parentTask.due_date)}</span>
                                    <span class="px-2 py-1 bg-green-100 text-green-700 rounded-full">👤 ${parentTask.assign_person}</span>
                                    <span class="px-2 py-1 bg-yellow-100 text-yellow-700 rounded-full">⏱️ ${totalHours} ชั่วโมง</span>
                                    <span class="px-2 py-1 bg-blue-100 text-blue-700 rounded-full">📝 ${actions.length} Actions</span>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="showAddActionModal('${parentTask.parent_task_id}')" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm transition-colors">
                                    ➕ Action
                                </button>
                                <button onclick="deleteItem('${parentTask.__backendId}')" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm transition-colors">
                                    🗑️
                                </button>
                            </div>
                        </div>
                        
                        ${actions.length > 0 ? `
                        <div class="mt-4 border-t pt-4">
                            <h4 class="text-md font-medium text-gray-700 mb-3">Action Tasks (${completedActions}/${actions.length} เสร็จแล้ว)</h4>
                            <div class="space-y-2 max-h-64 overflow-y-auto">
                                ${actions.map(action => `
                                    <div class="action-item flex items-center justify-between p-3 bg-white rounded border">
                                        <div class="flex-1">
                                            <div class="flex items-center gap-2 mb-1">
                                                <h5 class="font-medium text-gray-800">${action.title}</h5>
                                                <span class="px-2 py-1 text-xs rounded-full ${action.status === 'complete' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                                                    ${action.status === 'complete' ? '✅ เสร็จแล้ว' : '⏳ กำลังดำเนินการ'}
                                                </span>
                                            </div>
                                            ${action.description ? `<p class="text-sm text-gray-600 mb-1">${action.description}</p>` : ''}
                                            <div class="flex items-center gap-2 text-sm text-gray-500">
                                                <span>⏱️ ${action.hours} ชั่วโมง</span>
                                                <span>📅 ${formatDate(action.created_at.split('T')[0])}</span>
                                            </div>
                                        </div>
                                        <div class="flex gap-2 ml-4">
                                            <select onchange="updateActionStatus('${action.__backendId}', this.value)" 
                                                    class="border border-gray-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                                <option value="in-progress" ${action.status === 'in-progress' ? 'selected' : ''}>กำลังดำเนินการ</option>
                                                <option value="complete" ${action.status === 'complete' ? 'selected' : ''}>เสร็จแล้ว</option>
                                            </select>
                                            <button onclick="deleteItem('${action.__backendId}')" class="text-red-500 hover:text-red-700 px-2 py-1 text-sm">
                                                🗑️
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // Filter functions
        function getFilteredParentTasks() {
            const personFilter = document.getElementById('personFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            let parentTasks = allData.filter(item => item.type === 'parent');

            if (personFilter !== 'all') {
                parentTasks = parentTasks.filter(task => task.assign_person === personFilter);
            }

            if (statusFilter !== 'all') {
                parentTasks = parentTasks.filter(task => {
                    const actions = allData.filter(item =>
                        item.parent_task_id === task.parent_task_id &&
                        item.type === 'action'
                    );

                    if (statusFilter === 'complete') {
                        return actions.length > 0 && actions.every(action => action.status === 'complete');
                    } else if (statusFilter === 'in-progress') {
                        return actions.some(action => action.status === 'in-progress');
                    }
                    return true;
                });
            }

            return parentTasks.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        }

        function filterTasks() {
            renderTasks();
        }

        function updateFilters() {
            const personFilter = document.getElementById('personFilter');
            const currentPersonValue = personFilter.value;

            // Update person filter options
            const persons = [...new Set(allData
                .filter(item => item.type === 'parent' && item.assign_person)
                .map(item => item.assign_person))];

            personFilter.innerHTML = '<option value="all">ทั้งหมด</option>' +
                persons.map(person => `<option value="${person}">${person}</option>`).join('');

            if (persons.includes(currentPersonValue)) {
                personFilter.value = currentPersonValue;
            }
        }

        // Update stats
        function updateStats() {
            const parentTasks = allData.filter(item => item.type === 'parent');
            const actionTasks = allData.filter(item => item.type === 'action');
            const totalHours = actionTasks.reduce((sum, action) => sum + (action.hours || 0), 0);
            const completedActions = actionTasks.filter(action => action.status === 'complete').length;

            document.getElementById('totalParentTasks').textContent = parentTasks.length;
            document.getElementById('totalActionTasks').textContent = actionTasks.length;
            document.getElementById('totalHours').textContent = totalHours;
            document.getElementById('completedActions').textContent = completedActions;
        }

        // Utility functions
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('th-TH');
        }

        // Close modals when clicking outside
        document.getElementById('addTaskModal').addEventListener('click', function (e) {
            if (e.target === this) {
                hideAddTaskModal();
            }
        });

        document.getElementById('addActionModal').addEventListener('click', function (e) {
            if (e.target === this) {
                hideAddActionModal();
            }
        });

        // Initialize the application
        initializeApp();
    </script>
